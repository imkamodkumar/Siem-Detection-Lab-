title: Office Application Spawning Shell (Macro Behaviour)
id: 947da8b3-4559-47bf-80c0-b5c9c338c541
status: experimental
description: Detects Word, Excel or PowerPoint spawning cmd.exe or PowerShell - classic behaviour of a malicious macro after a phishing click.
references:
  - https://attack.mitre.org/techniques/T1566/001/
author: Maaz Husain
date: 2026-07-02
tags:
  - attack.initial_access
  - attack.t1566.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Rare legitimate add-ins; investigate any hit
level: high
